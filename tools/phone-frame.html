<!doctype html>
<meta charset="utf-8">
<title>Phone frame</title>
<!-- Headless Chrome won't open a window narrower than ~500 px, so phone shots load the page
     in a 390 px iframe here centred; screenshots.sh crops the image to that width. -->
<style>html, body { margin: 0; background: #fff; } iframe { display: block; width: 390px; height: 100vh; border: 0; margin: 0 auto; }</style>
<iframe id="f"></iframe>
<script>document.getElementById("f").src = "../examples/product-analytics.html" + location.search;</script>
